<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForJob.in - Direct Jobs in Pune</title>
    <!-- Favicon link -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brand-text {
            color: #0b5c9e;
        }
        .text-glow {
            text-shadow: 0 4px 12px rgba(11, 92, 158, 0.15);
        }
        .fade-text {
            transition: opacity 0.6s ease-in-out;
        }
        .brand-hover:hover {
            color: #1279ce;
        }
    </style>
</head>
<body class="bg-white brand-text min-h-screen flex flex-col justify-between selection:bg-[#0b5c9e] selection:text-white font-sans">

    <!-- TOP SECTION: Rotating 2-Ad Loop -->
    <header class="w-full pt-8 pb-4 text-center px-4">
        <!-- Fixed height wrapper prevents iPhone vertical layout jumps -->
        <div class="min-h-[85px] flex flex-col items-center justify-center">
            <div id="rotating-ad-container" class="fade-text flex flex-col items-center space-y-1">
                <!-- Dynamically populated via script -->
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 max-w-xl mx-auto w-full transition-all duration-300">
        
        <!-- VIEW 1: Main Category Hashtags (Dynamically Loaded from Google Sheet) -->
        <div id="main-view" class="w-full flex flex-col items-center space-y-6 text-center pt-2">
            <div id="dynamic-ctas-container" class="w-full flex flex-col space-y-4 text-2xl sm:text-3xl font-bold tracking-tight">
                <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold animate-pulse">Loading categories...</p>
            </div>
        </div>

        <!-- VIEW 2: Focused Sub-Tier / Wizard View -->
        <div id="focus-view" class="w-full hidden flex flex-col items-center text-center space-y-6">
            <!-- Text-only Back Toggle -->
            <button onclick="goBack()" class="text-sm font-medium text-slate-400 brand-hover transition-colors tracking-wide cursor-pointer mb-2">
                ← Back to categories
            </button>

            <!-- Centered Active Title -->
            <h2 id="active-category-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-glow"></h2>

            <!-- Dynamic Step Container -->
            <div id="wizard-step-container" class="w-full flex flex-col space-y-4 pt-4">
                <p id="wizard-step-label" class="text-xs uppercase tracking-widest text-slate-400 font-semibold"></p>
                <div id="wizard-options-container" class="flex flex-col space-y-3 text-2xl font-bold tracking-tight">
                    <!-- Dynamically populated via JS -->
                </div>
            </div>

            <!-- FINAL STEP: Contact Capture Box -->
            <div id="contact-step-container" class="w-full hidden flex flex-col space-y-4 pt-6 border-t border-slate-100 mt-4 text-left bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs uppercase tracking-widest text-slate-500 font-bold text-center">Almost Done! Where should employers reach you?</p>
                <form id="lead-form" onsubmit="submitLead(event)" class="space-y-4 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
                        <input type="text" id="userName" required placeholder="Enter your full name" 
                            class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0b5c9e]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">WhatsApp Number</label>
                        <input type="tel" id="userPhone" required placeholder="10-digit mobile number" 
                            class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0b5c9e]">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full py-3.5 bg-[#0b5c9e] hover:bg-[#1279ce] text-white font-bold rounded-xl shadow-sm text-sm transition-all tracking-wide cursor-pointer">
                        Complete & Connect →
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- FOOTER SECTION -->
    <footer class="w-full py-8 text-center px-4 flex flex-col items-center space-y-4 border-t border-slate-50 mt-12">
        <div class="flex flex-wrap justify-center gap-6 text-xs sm:text-sm font-medium text-slate-500">
            <a href="employers.html" class="brand-hover transition-colors">For Employers</a>
            <a href="privacy.html" class="brand-hover transition-colors">Privacy Policy</a>
            <a href="contact.html" class="brand-hover transition-colors">Contact Us</a>
        </div>
        <div class="text-xl font-black tracking-tighter text-glow">
            FORJOB.IN
        </div>
        <p class="text-[11px] text-slate-400">© 2026 ForJob.in. Pune, India.</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Rotating Ads Data Pool
        const ads = [
            {
                header: "Pune Hiring Drive",
                subheader: "Direct Employer Connect",
                linkText: "Register",
                url: "https://tally.so/r/Ek74e2"
            },
            {
                header: "Recruiter Active Directory",
                subheader: "Connect with verified hiring teams",
                linkText: "Register",
                url: "https://forjob.in/recruitment.html"
            }
        ];

        let currentAdIndex = 0;
        const adContainer = document.getElementById("rotating-ad-container");

        function renderAd() {
            const ad = ads[currentAdIndex];
            adContainer.style.opacity = 0;
            
            setTimeout(() => {
                adContainer.innerHTML = `
                    <h3 class="text-lg sm:text-2xl font-extrabold uppercase tracking-wide text-slate-800">${ad.header}</h3>
                    <p class="text-base sm:text-lg font-medium text-slate-600">${ad.subheader}</p>
                    <a href="${ad.url}" class="text-xs sm:text-sm font-semibold italic brand-hover transition-colors pt-1 cursor-pointer">${ad.linkText} →</a>
                `;
                adContainer.style.opacity = 1;
            }, 500);
        }

        renderAd();
        setInterval(() => {
            currentAdIndex = (currentAdIndex + 1) % ads.length;
            renderAd();
        }, 4500);

        // Funnel State & Google Sheet API Configuration
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_PMERZUGnnd8y6uD7bya9sIlukrvCF6zYVG77DmqcuQbwJvpdXoFz4PiyjTjsLUYmYw/exec";

        let funnelConfigData = [];
        let sessionState = {
            category: "",
            experience: "",
            subSkill: ""
        };

        // Fetch Funnel Configuration from Google Sheet on page load
        async function loadFunnelConfig() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                funnelConfigData = await response.json();
                renderStep1CTAs();
            } catch (error) {
                console.error("Error loading funnel config from Google Sheet:", error);
                // Fallback hardcoded CTAs matching your exact requested 4 categories if API is offline
                funnelConfigData = [
                    { step: 1, parentKey: "root", ctaText: "#HR_Recruitment", actionValue: "hr_recruitment" },
                    { step: 1, parentKey: "root", ctaText: "#International_Voice", actionValue: "intl_voice" },
                    { step: 1, parentKey: "root", ctaText: "#Domestic_Voice", actionValue: "dom_voice" },
                    { step: 1, parentKey: "root", ctaText: "#Reception_Admin", actionValue: "reception_admin" },
                    { step: 2, parentKey: "intl_voice", ctaText: "#Fresher", actionValue: "fresher" },
                    { step: 2, parentKey: "intl_voice", ctaText: "#Experienced", actionValue: "experienced" },
                    { step: 2, parentKey: "dom_voice", ctaText: "#Fresher", actionValue: "fresher" },
                    { step: 2, parentKey: "dom_voice", ctaText: "#Experienced", actionValue: "experienced" },
                    { step: 2, parentKey: "reception_admin", ctaText: "#Fresher", actionValue: "fresher" },
                    { step: 2, parentKey: "reception_admin", ctaText: "#Experienced", actionValue: "experienced" }
                ];
                renderStep1CTAs();
            }
        }

        function renderStep1CTAs() {
            const container = document.getElementById("dynamic-ctas-container");
            container.innerHTML = "";

            const step1Rows = funnelConfigData.filter(row => String(row.step) === "1" && row.parentKey === "root");

            if (step1Rows.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400">No categories available at the moment.</p>`;
                return;
            }

            step1Rows.forEach(row => {
                const btn = document.createElement("button");
                btn.className = "brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer";
                btn.textContent = row.ctaText;
                btn.onclick = () => handleCategorySelection(row.actionValue, row.ctaText);
                container.appendChild(btn);
            });
        }

        function handleCategorySelection(actionValue, ctaText) {
            sessionState.category = actionValue;

            // Special path shortcut for HR Recruitment directly to RAD
            if (actionValue === "hr_recruitment") {
                window.location.href = "https://forjob.in/recruitment.html";
                return;
            }

            document.getElementById("main-view").classList.add("hidden");
            document.getElementById("active-category-title").textContent = ctaText;
            document.getElementById("focus-view").classList.remove("hidden");
            
            renderNextStep(2, actionValue, "Select Experience Level");
        }

        function renderNextStep(stepNumber, parentKey, labelText) {
            const stepContainer = document.getElementById("wizard-step-container");
            const optionsContainer = document.getElementById("wizard-options-container");
            const labelEl = document.getElementById("wizard-step-label");
            const contactContainer = document.getElementById("contact-step-container");

            contactContainer.classList.add("hidden");
            stepContainer.classList.remove("hidden");
            optionsContainer.innerHTML = "";
            labelEl.textContent = labelText;

            const matchingRows = funnelConfigData.filter(row => String(row.step) === String(stepNumber) && row.parentKey === parentKey);

            if (matchingRows.length === 0) {
                stepContainer.classList.add("hidden");
                contactContainer.classList.remove("hidden");
                return;
            }

            matchingRows.forEach(row => {
                const btn = document.createElement("button");
                btn.className = "brand-hover transition-all text-glow cursor-pointer";
                btn.textContent = row.ctaText;
                btn.onclick = () => handleWizardChoice(stepNumber, row.actionValue, row.ctaText);
                optionsContainer.appendChild(btn);
            });
        }

        function handleWizardChoice(currentStep, actionValue, ctaText) {
            if (currentStep === 2) {
                sessionState.experience = actionValue;
                const nextStepRows = funnelConfigData.filter(row => String(row.step) === "3" && row.parentKey === actionValue);
                if (nextStepRows.length > 0) {
                    renderNextStep(3, actionValue, "Select Preference / Skill");
                } else {
                    document.getElementById("wizard-step-container").classList.add("hidden");
                    document.getElementById("contact-step-container").classList.remove("hidden");
                }
            } else if (currentStep === 3) {
                sessionState.subSkill = actionValue;
                document.getElementById("wizard-step-container").classList.add("hidden");
                document.getElementById("contact-step-container").classList.remove("hidden");
            }
        }

        function goBack() {
            document.getElementById("focus-view").classList.add("hidden");
            document.getElementById("contact-step-container").classList.add("hidden");
            document.getElementById("wizard-step-container").classList.remove("hidden");
            document.getElementById("main-view").classList.remove("hidden");
            sessionState = { category: "", experience: "", subSkill: "" };
        }

        async function submitLead(event) {
            event.preventDefault();
            const name = document.getElementById("userName").value.trim();
            const phone = document.getElementById("userPhone").value.trim();
            const submitBtn = document.getElementById("submit-btn");

            submitBtn.textContent = "Submitting...";
            submitBtn.disabled = true;

            const payload = {
                timestamp: new Date().toISOString(),
                category: sessionState.category,
                experience: sessionState.experience,
                subSkill: sessionState.subSkill,
                fullName: name,
                whatsapp: phone
            };

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                alert("Thank you! Your details have been submitted successfully.");
                window.location.reload();
            } catch (err) {
                console.error("Submission error:", err);
                alert("Thank you! Connecting you now.");
                window.location.reload();
            }
        }

        // Initialize dynamic funnel loading on startup
        loadFunnelConfig();
    </script>
</body>
</html>
