 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- EDITABLE SEO: Page Title -->
    <title>ForJob.in - Direct Voice, Sales & Desk Jobs in Pune</title>
    <meta name="description" content="Find direct BPO, International Voice, Domestic Voice, Sales, Administration, and Healthcare nursing jobs in Pune. Zero middlemen.">
    <!-- Favicon link -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Real Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .brand-text { color: #0b5c9e; }
        .text-glow { text-shadow: 0 4px 12px rgba(11, 92, 158, 0.15); }
        .fade-text { transition: opacity 0.6s ease-in-out; }
        .brand-hover:hover { color: #1279ce; }
    </style>
</head>
<body class="bg-white brand-text min-h-screen flex flex-col justify-between selection:bg-[#0b5c9e] selection:text-white font-sans">

    <!-- ========================================== -->
    <!-- ZONE 1: ROTATING TICKER & URGENT AD SPACE  -->
    <!-- ========================================== -->
    <header class="w-full pt-8 pb-4 text-center px-4">
        <div class="min-h-[85px] flex flex-col items-center justify-center">
            <!-- EDITABLE: Double-up as ad space for walk-ins or urgent roles -->
            <div id="rotating-ad-container" class="fade-text flex flex-col items-center space-y-1">
                <!-- Dynamically populated via script -->
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- ZONE 2: CORE CATEGORY GATEWAY              -->
    <!-- ========================================== -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 max-w-xl mx-auto w-full transition-all duration-300">
        <div id="main-view" class="w-full flex flex-col items-center space-y-6 text-center pt-2">
            <h1 class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-1">Select a category to apply</h1>
            
            <!-- EDITABLE SECTION: Main Category CTAs mapped to your created pages -->
            <div class="w-full flex flex-col space-y-4 text-2xl sm:text-3xl font-bold tracking-tight">
                <a href="hr.html" class="brand-hover transition-all transform hover:scale-105 text-glow">#HR</a>
                <a href="bpo.html" class="brand-hover transition-all transform hover:scale-105 text-glow">#BPO</a>
                <a href="sales.html" class="brand-hover transition-all transform hover:scale-105 text-glow">#SALES</a>
                <a href="front-office.html" class="brand-hover transition-all transform hover:scale-105 text-glow">#FRONT_OFFICE</a>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- ZONE 3: SOCIAL MEDIA BAR (ABOVE FOOTER)    -->
    <!-- ========================================== -->
    <section class="w-full py-6 px-4 flex flex-col items-center justify-center space-y-3 bg-slate-50 border-t border-slate-100">
        <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Join our broadcast channels & groups</p>
        <div class="flex items-center space-x-6 text-2xl">
            <!-- LinkedIn -->
            <a href="contact.html" class="brand-hover transition-transform hover:scale-110" title="LinkedIn Groups & Pages">
                <i class="fa-brands fa-linkedin"></i>
            </a>
            <!-- Facebook -->
            <a href="contact.html" class="brand-hover transition-transform hover:scale-110" title="Facebook Job Groups">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <!-- WhatsApp -->
            <a href="contact.html" class="brand-hover transition-transform hover:scale-110" title="WhatsApp Job Broadcast Channels">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- TRUST SIGNALS & FOOTER                     -->
    <!-- ========================================== -->
    <footer class="w-full py-8 text-center px-4 flex flex-col items-center space-y-4 border-t border-slate-50">
        <!-- EDITABLE FOOTER LINKS -->
        <div class="flex flex-wrap justify-center gap-6 text-xs sm:text-sm font-medium text-slate-500">
            <a href="employers.html" class="brand-hover transition-colors">For Employers</a>
            <a href="privacy.html" class="brand-hover transition-colors">Privacy Policy</a>
            <a href="contact.html" class="brand-hover transition-colors">Contact Us</a>
        </div>
        <div class="text-xl font-black tracking-tighter text-glow">
            FORJOB.IN
        </div>
        <p class="text-[11px] text-slate-400">© 2026 ForJob.in. Pune, India.</p>
    </footer>

    <!-- JAVASCRIPT: Zone 1 Ticker Logic -->
    <script>
        // EDITABLE: Change Zone 1 rotating banner messages & target links here
        const ads = [
            {
                header: "Are you a Fresher, open to Night Shift?",
                subheader: "Direct Employer Connections in Pune",
                linkText: "Apply Now",
                url: "bpo.html"
            },
            {
                header: "Are you a Fresher, Open to Calling jobs?",
                subheader: "Multilingual & Voice Process Jobs",
                linkText: "Apply Now",
                url: "bpo.html"
            },
            {
                header: "Are you a Fresher, Open to Sales jobs?",
                subheader: "BD, Inside Sales & Lead Generation",
                linkText: "Apply Now",
                url: "sales.html"
            }
        ];

        let currentAdIndex = 0;
        const adContainer = document.getElementById("rotating-ad-container");

        function renderAd() {
            const ad = ads[currentAdIndex];
            adContainer.style.opacity = 0;
            setTimeout(() => {
                adContainer.innerHTML = `
                    <h3 class="text-base sm:text-xl font-extrabold uppercase tracking-wide text-slate-800">${ad.header}</h3>
                    <p class="text-sm font-medium text-slate-600">${ad.subheader} <span class="text-[#0b5c9e] font-bold italic">(${ad.linkText} →)</span></p>
                `;
                adContainer.style.opacity = 1;
            }, 500);
        }

        renderAd();
        setInterval(() => {
            currentAdIndex = (currentAdIndex + 1) % ads.length;
            renderAd();
        }, 5000);
    </script>
</body>
</html>
