<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForJob.in - Direct Jobs in Pune</title>
    <!-- Favicon link -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brand-text {
            color: #0b5c9e;
        }
        .text-glow {
            text-shadow: 0 4px 12px rgba(11, 92, 158, 0.15);
        }
        .fade-text {
            transition: opacity 0.6s ease-in-out;
        }
        .brand-hover:hover {
            color: #1279ce;
        }
        /* Smooth Marquee Styling */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
        .marquee-track {
            display: inline-block;
            animation: marquee 22s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body class="bg-white brand-text min-h-screen flex flex-col justify-between selection:bg-[#0b5c9e] selection:text-white font-sans">

    <!-- TOP SECTION: Dynamic Google Sheet Multi-Pill Container -->
    <header class="w-full pt-8 pb-4 text-center px-4">
        <div id="dynamic-pills-container" class="flex flex-col items-center space-y-2 opacity-0 transition-opacity duration-500">
            <!-- Dynamically populated from Google Sheet -->
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 max-w-xl mx-auto w-full transition-all duration-300">
        
        <!-- VIEW 1: Main Category Hashtags & Marquee Banner -->
        <div id="main-view" class="w-full flex flex-col items-center space-y-6 text-center">
            
            <!-- MARQUEE BANNER -->
            <a href="recruiter-directory.html" class="block w-full bg-slate-50 border-y border-slate-100 py-3 my-2 marquee-container shadow-sm rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
                <div class="marquee-track text-sm sm:text-base font-semibold tracking-wider text-slate-600 uppercase">
                    <span>🚀 🚀 Fast-track your career in HR/Recruitment &nbsp;&bull;&nbsp; Join our Recruiter Active Directory &nbsp;&bull;&nbsp; </span>
                    <span>🚀 🚀 Fast-track your career in HR/Recruitment &nbsp;&bull;&nbsp; Join our Recruiter Active Directory &nbsp;&bull;&nbsp; </span>
                </div>
            </a>
            
            <div class="w-full flex flex-col space-y-4 text-2xl sm:text-3xl font-bold tracking-tight pt-2">
                <button onclick="selectCategory('#HR_Recruitment')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#HR_Recruitment</button>
                <button onclick="selectCategory('#International_BPO')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#International_BPO</button>
                <button onclick="selectCategory('#Tele_Sales_Services')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#Tele_Sales_Services</button>
                <button onclick="selectCategory('#BD_Sales')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#BD_Sales</button>
                <button onclick="selectCategory('#Reception_Admin')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#Reception_Admin</button>
            </div>
        </div>

        <!-- VIEW 2: Focused Sub-Tier View -->
        <div id="focus-view" class="w-full hidden flex flex-col items-center text-center space-y-6">
            <!-- Text-only Back Toggle -->
            <button onclick="goBack()" class="text-sm font-medium text-slate-400 brand-hover transition-colors tracking-wide cursor-pointer mb-2">
                ← Back to categories
            </button>

            <!-- Centered Active Title -->
            <h2 id="active-category-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-glow"></h2>

            <!-- Tier 2: Experience Split -->
            <div class="w-full flex flex-col space-y-4 pt-4">
                <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Select Experience Level</p>
                <div class="flex flex-col space-y-3 text-2xl font-bold tracking-tight">
                    <button onclick="handleTier2('#Fresher')" class="brand-hover transition-all text-glow cursor-pointer">#Fresher</button>
                    <button onclick="handleTier2('#Experienced')" class="brand-hover transition-all text-glow cursor-pointer">#Experienced</button>
                </div>
            </div>

            <!-- Tier 3: Contextual Sub-Filter -->
            <div id="tier-3-container" class="w-full hidden flex flex-col space-y-4 pt-6 border-t border-slate-100 mt-4">
                <p id="tier-3-label" class="text-xs uppercase tracking-widest text-slate-400 font-semibold"></p>
                <div id="tier-3-options" class="flex flex-col space-y-3 text-xl font-bold tracking-tight">
                    <!-- Dynamically populated via JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER SECTION -->
    <footer class="w-full py-8 text-center px-4 flex flex-col items-center space-y-4 border-t border-slate-50 mt-12">
        <div class="flex flex-wrap justify-center gap-6 text-xs sm:text-sm font-medium text-slate-500">
            <a href="employers.html" class="brand-hover transition-colors">For Employers</a>
            <a href="privacy.html" class="brand-hover transition-colors">Privacy Policy</a>
            <a href="contact.html" class="brand-hover transition-colors">Contact Us</a>
        </div>
        <div class="text-xl font-black tracking-tighter text-glow">
            FORJOB.IN
        </div>
        <p class="text-[11px] text-slate-400">© 2026 ForJob.in. Pune, India.</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let selectedCat = "";
        let selectedExp = "";

        // Fetch multiple dynamic pills from Google Sheet web app
        async function fetchBanners() {
            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbzQJF6bgiyzbLkilZAhWJ7g5u1XGsoV-ZT3-PgaNtLqBGUdaovEIRnDXwMUCBUazT09/exec");
                const banners = await response.json(); // Expected format: [{text: "...", link: "..."}, ...]
                
                const container = document.getElementById("dynamic-pills-container");
                container.innerHTML = ""; // Clear loader if any

                if (Array.isArray(banners) && banners.length > 0) {
                    banners.forEach(item => {
                        if (item.text && item.link) {
                            const pill = document.createElement("a");
                            pill.href = item.link;
                            pill.className = "text-xs sm:text-sm font-semibold tracking-wide text-slate-700 uppercase bg-slate-50 border border-slate-200 hover:border-[#0b5c9e] hover:text-[#0b5c9e] py-2 px-4 rounded-full shadow-sm inline-block transition-all cursor-pointer";
                            pill.textContent = item.text;
                            container.appendChild(pill);
                        }
                    });
                    // Fade container into view
                    container.classList.remove("opacity-0");
                }
            } catch (error) {
                console.error("Error fetching banners:", error);
            }
        }

        // Run immediately on page load
        fetchBanners();

        function selectCategory(category) {
            selectedCat = category;
            
            if (category === '#HR_Recruitment') {
                const radFormUrl = "https://tally.so/r/EkooyA";
                window.location.href = radFormUrl;
                return;
            }

            document.getElementById("main-view").classList.add("hidden");
            document.getElementById("active-category-title").textContent = category;
            document.getElementById("focus-view").classList.remove("hidden");
            document.getElementById("tier-3-container").classList.add("hidden");
        }

        function handleTier2(expLevel) {
            selectedExp = expLevel;
            redirectToForm(selectedExp);
        }

        function redirectToForm(finalSubTag) {
            const fresherFormUrl = "https://tally.so/r/Ek74e2";
            const experiencedFormUrl = "https://tally.so/r/ZjrpKA";
            
            const targetUrl = (selectedExp === '#Fresher') ? fresherFormUrl : experiencedFormUrl;
            window.location.href = targetUrl;
        }

        function goBack() {
            document.getElementById("focus-view").classList.add("hidden");
            document.getElementById("main-view").classList.remove("hidden");
            selectedCat = "";
            selectedExp = "";
        }
    </script>
</body>
</html>
