<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPO Jobs in Pune - ForJob.in</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Real Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .brand-text { color: #0b5c9e; }
        .text-glow { text-shadow: 0 4px 12px rgba(11, 92, 158, 0.15); }
        .brand-hover:hover { color: #1279ce; }
    </style>
</head>
<body class="bg-white brand-text min-h-screen flex flex-col justify-between selection:bg-[#0b5c9e] selection:text-white font-sans">

    <header class="w-full pt-8 pb-4 text-center px-4">
        <div class="min-h-[85px] flex flex-col items-center justify-center">
            <h3 class="text-lg sm:text-2xl font-extrabold uppercase tracking-wide text-slate-800">#BPO Openings</h3>
            <p class="text-base sm:text-lg font-medium text-slate-600">Voice, Chat & IT Support Drives in Pune</p>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-4 max-w-xl mx-auto w-full">
        <div class="w-full text-left mb-4">
            <a href="index.html" class="text-sm font-medium text-slate-400 brand-hover transition-colors tracking-wide cursor-pointer">← All Categories</a>
        </div>

        <!-- Step 1: Experience -->
        <div id="step-exp-view" class="w-full flex flex-col items-center space-y-6 text-center pt-2">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-glow">#BPO</h1>
            <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Select Experience Level</p>
            <div class="w-full flex flex-col space-y-3 text-2xl sm:text-3xl font-bold tracking-tight">
                <button onclick="selectExperience('#FRESHER')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#FRESHER</button>
                <button onclick="selectExperience('#EXPERIENCED')" class="brand-hover transition-all transform hover:scale-105 text-glow cursor-pointer">#EXPERIENCED</button>
            </div>
        </div>

        <!-- Step 2: Wizard Options -->
        <div id="wizard-view" class="w-full hidden flex flex-col items-center text-center space-y-6">
            <button onclick="resetWizard()" class="text-sm font-medium text-slate-400 brand-hover transition-colors tracking-wide cursor-pointer mb-2">← Back</button>
            <h2 id="wizard-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-glow"></h2>
            <div class="w-full flex flex-col space-y-4 pt-4">
                <p id="wizard-step-label" class="text-xs uppercase tracking-widest text-slate-400 font-semibold"></p>
                <div id="wizard-options-container" class="flex flex-col space-y-3 text-2xl font-bold tracking-tight"></div>
            </div>
        </div>

        <!-- Final Step: Contact -->
        <div id="contact-step-container" class="w-full hidden flex flex-col space-y-4 pt-6 border-t border-slate-100 mt-4 text-left bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-sm">
            <button onclick="backToWizardStep()" class="text-xs font-medium text-slate-400 brand-hover transition-colors tracking-wide cursor-pointer mb-1">← Back</button>
            <p class="text-xs uppercase tracking-widest text-slate-500 font-bold text-center">Almost Done! Where should employers reach you?</p>
            <form id="lead-form" onsubmit="submitLead(event)" class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="userName" required placeholder="Enter your full name" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0b5c9e]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">WhatsApp Number</label>
                    <input type="tel" id="userPhone" required pattern="[0-9]{10}" placeholder="10-digit mobile number" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0b5c9e]">
                </div>
                <button type="submit" id="submit-btn" class="w-full py-3.5 bg-[#0b5c9e] hover:bg-[#1279ce] text-white font-bold rounded-xl shadow-sm text-sm transition-all tracking-wide cursor-pointer">Complete & Connect →</button>
            </form>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- ZONE 3: SOCIAL MEDIA BAR (ABOVE FOOTER)    -->
    <!-- ========================================== -->
    <section class="w-full py-6 px-4 flex flex-col items-center justify-center space-y-3 bg-slate-50 border-t border-slate-100">
        <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Join our broadcast channels & groups</p>
        <div class="flex items-center space-x-6 text-2xl">
            <!-- LinkedIn -->
            <a href="contact.html" class="brand-hover transition-transform hover:scale-110" title="LinkedIn Groups & Pages">
                <i class="fa-brands fa-linkedin"></i>
            </a>
            <!-- Facebook -->
            <a href="contact.html" class="brand-hover transition-transform hover:scale-110" title="Facebook Job Groups">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <!-- WhatsApp -->
            <a href="contact.html" class="brand-hover transition-transform hover:scale-110" title="WhatsApp Job Broadcast Channels">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- TRUST SIGNALS & FOOTER                     -->
    <!-- ========================================== -->
    <footer class="w-full py-8 text-center px-4 flex flex-col items-center space-y-4 border-t border-slate-50">
        <!-- EDITABLE FOOTER LINKS -->
        <div class="flex flex-wrap justify-center gap-6 text-xs sm:text-sm font-medium text-slate-500">
            <a href="employers.html" class="brand-hover transition-colors">For Employers</a>
            <a href="privacy.html" class="brand-hover transition-colors">Privacy Policy</a>
            <a href="contact.html" class="brand-hover transition-colors">Contact Us</a>
        </div>
        <div class="text-xl font-black tracking-tighter text-glow">
            FORJOB.IN
        </div>
        <p class="text-[11px] text-slate-400">© 2026 ForJob.in. Pune, India.</p>
    </footer>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHwj2h5Ol8-XlJXlLIJZ7bG4AQ2bdxZEtsLkEN2MCdt9KyJ8o7L7zhoCjMXGkrYpgV/exec";
        let sessionState = { category: "#BPO", experience: "", subSkill: "" };

        function selectExperience(exp) {
            sessionState.experience = exp;
            document.getElementById("step-exp-view").classList.add("hidden");
            document.getElementById("wizard-view").classList.remove("hidden");
            document.getElementById("wizard-title").textContent = exp;

            document.getElementById("wizard-step-label").textContent = exp === "#FRESHER" ? "Select Shift Preference" : "Select Specialization";
            const container = document.getElementById("wizard-options-container");
            container.innerHTML = "";

            const options = exp === "#FRESHER" 
                ? ["#DayShift_Only", "#Nightshift_OK", "#Rotational_OK"]
                : ["#VOICE", "#CHAT", "#BLENDED", "#IT_Support"];

            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "brand-hover transition-all text-glow cursor-pointer";
                btn.textContent = opt;
                btn.onclick = () => { sessionState.subSkill = opt; showContactForm(); };
                container.appendChild(btn);
            });
        }

        function showContactForm() {
            document.getElementById("wizard-view").classList.add("hidden");
            document.getElementById("contact-step-container").classList.remove("hidden");
        }

        function backToWizardStep() {
            document.getElementById("contact-step-container").classList.add("hidden");
            document.getElementById("wizard-view").classList.remove("hidden");
        }

        function resetWizard() {
            document.getElementById("wizard-view").classList.add("hidden");
            document.getElementById("contact-step-container").classList.add("hidden");
            document.getElementById("step-exp-view").classList.remove("hidden");
            sessionState = { category: "#BPO", experience: "", subSkill: "" };
        }

        async function submitLead(event) {
            event.preventDefault();
            const name = document.getElementById("userName").value.trim();
            const phone = document.getElementById("userPhone").value.trim();
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.textContent = "Submitting...";
            submitBtn.disabled = true;

            const payload = {
                timestamp: new Date().toISOString(),
                category: sessionState.category,
                experience: sessionState.experience,
                subSkill: sessionState.subSkill,
                fullName: name,
                whatsapp: phone
            };

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST", mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                alert("Thank you! Details submitted successfully.");
                window.location.href = "index.html";
            } catch (err) {
                alert("Thank you! Connecting you now.");
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
